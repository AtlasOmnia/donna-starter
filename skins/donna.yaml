name: donna
description: Donna Paulsen — executive polish. Espresso dark, champagne, copper, and merlot; diamond motif.

# Palette
#   champagne ivory  #F6E7CE   (primary text, light rows)
#   soft gold        #EFC79C   (gradient step)
#   copper           #E0915B   (accent — Donna's hair, banner headers)
#   amber            #E2AA67   (tools / thinking)
#   rose             #D06A64   (gradient step)
#   Donna red        #C94F68   (labels, keywords)
#   merlot           #8E3A4E   (deep shadow rows — decorative only)
#   warm espresso bg #14100F   (background — warm, not blue)

colors:
  background: "#14100F"

  banner_border: "#6B5142"
  banner_title: "#F6E7CE"
  banner_accent: "#E0915B"
  banner_dim: "#BCA893"
  banner_text: "#F6E7CE"

  ui_accent: "#E0915B"
  ui_label: "#C94F68"
  ui_text: "#F6E7CE"
  ui_primary: "#F6E7CE"
  ui_border: "#6B5142"
  ui_tool: "#E2AA67"
  ui_thinking: "#E2AA67"
  ui_ok: "#EFC79C"
  ui_warn: "#E0A34B"
  ui_error: "#E27272"

  prompt: "#F6E7CE"
  input_rule: "#6B5142"
  response_border: "#E0915B"
  session_label: "#E0915B"
  session_border: "#6B5142"
  section_label: "#C94F68"

  status_bar_bg: "#0D0A09"
