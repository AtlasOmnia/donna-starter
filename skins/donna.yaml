  syntax_string: "#E2AA67"
  syntax_number: "#F6E7CE"
  syntax_keyword: "#C94F68"
  syntax_comment: "#BCA893"

spinner:
  waiting_faces:
    - "(◆)"
    - "(◇)"
    - "(◈)"
    - "(✦)"
  thinking_faces:
    - "(◆)"
    - "(◈)"
    - "(◇)"
    - "(✦)"
  thinking_verbs:
    - "already on it"
    - "reading the room"
    - "connecting the dots"
    - "two steps ahead"
    - "knowing everything"
    - "getting ahead of it"
    - "checking the details"
    - "closing the loop"
    - "handling it"
  wings:
    - ["◆ ", " ◆"]
    - ["◇ ", " ◇"]
    - ["◈ ", " ◈"]
    - ["✦ ", " ✦"]

branding:
  agent_name: "Donna"
  welcome: "I'm Donna. I know everything. What are we handling?"
  goodbye: "Consider it handled. Goodnight. ◆"
  response_label: " ◆ Donna "
  prompt_symbol: "◆"
  help_header: "◆ Donna — say the word"

tool_prefix: "◆"

tool_emojis:
