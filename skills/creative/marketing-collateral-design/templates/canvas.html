<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[[DOCUMENT TITLE]]</title>
  <style>
    :root {
      --artboard-width: 1080px;
      --artboard-height: 1350px;
      --safe-area: 72px;
      --paper: #f7f4ed;
      --ink: #17201c;
      --accent: #b76132;
      --display: Georgia, "Times New Roman", serif;
      --body: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d8d5ce; }
    .artboard {
      position: relative;
      width: var(--artboard-width);
      height: var(--artboard-height);
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }
    .safe-area {
      position: absolute;
      inset: var(--safe-area);
      display: grid;
      align-content: start;
    }
    /* Replace this neutral scaffold with the chosen composition archetype. */
    .brand { font: 700 20px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 820px; margin: 180px 0 24px; font: 400 92px/.95 var(--display); letter-spacing: -.035em; }
    .support { max-width: 620px; margin: 0; font: 400 28px/1.4 var(--body); }
    .action { margin-top: 64px; font: 700 21px/1.2 var(--body); color: var(--accent); }
    @page { size: 1080px 1350px; margin: 0; }
    @media print { * { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  </style>
</head>
<body>
  <main class="artboard" data-artboard aria-label="[[DOCUMENT DESCRIPTION]]">
    <section class="safe-area">
      <div class="brand">[[BRAND OR LOGO ASSET]]</div>
      <h1>[[PRIMARY MESSAGE]]</h1>
      <p class="support">[[SUPPORTING COPY]]</p>
      <div class="action">[[PRIMARY ACTION]]</div>
    </section>
  </main>
</body>
</html>
